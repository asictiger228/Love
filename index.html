<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запрошення на весілля - Хафіз і Аіша</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap');

        body {
            background-color: #Fdfbf7;
            background-image: radial-gradient(#e2d5c5 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            color: #5c544d;
        }

        .invitation-card {
            background-color: #ffffff;
            border: 2px solid #e8dec8;
            border-radius: 12px;
            padding: 50px 40px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            position: relative;
            margin: 20px;
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #8c7b6d;
            margin-bottom: -10px;
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 56px;
            color: #b58d68;
            margin: 20px 0 10px 0;
            font-weight: normal;
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 48px;
            color: #8c7b6d;
            margin: 10px 0 30px 0;
        }

        .heart {
            color: #c4a485;
            font-size: 24px;
            margin: 10px 0;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            color: #c4a485;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #e8dec8;
            margin: 0 15px;
            max-width: 60px;
        }

        .text {
            font-size: 15px;
            line-height: 1.6;
            margin: 15px 0;
        }

        .details {
            margin: 30px 0;
            padding: 20px;
            background-color: #fbf9f5;
            border-radius: 8px;
            border: 1px dashed #e8dec8;
        }

        .details p {
            margin: 10px 0;
            font-size: 15px;
        }

        .details i {
            margin-right: 10px;
            color: #b58d68;
        }

        .footer {
            font-family: 'Great Vibes', cursive;
            font-size: 26px;
            color: #b58d68;
            margin-top: 30px;
        }

        .music-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e8dec8;
        }

        .music-section p {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <div class="subtitle">Запрошення на наше</div>
        <div class="title">Весілля</div>
        <div class="heart">♡</div>
        <div class="names">Хафіз і Аіша</div>
        
        <div class="divider">♡</div>
        
        <div class="text">Шановний(а) гість!</div>
        <div class="text">Будемо раді бачити Вас<br>на нашому весіллі!</div>
        
        <div class="divider">♡</div>

        <div class="details">
            <p>📅 <strong>Дата:</strong> 05.10.2026</p>
            <p>🕒 <strong>Час:</strong> 18:00</p>
            <p>📍 <strong>Місце:</strong> Туйхонаи Шохон</p>
        </div>

        <div class="footer">Будемо чекати<br>з нетерпінням! ♡</div>

        <div class="music-section">
            <p>Музика для настрою:</p>
            <!-- YouTube Player -->
            <iframe width="100%" height="80" src="https://www.youtube.com/embed/_JaO1So9764?autoplay=1" title="YouTube music" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
